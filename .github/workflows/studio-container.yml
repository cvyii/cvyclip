name: Verify and build CvyClip Studio
on:
  push:
    branches: [main, feature/cvyclip-studio]
    paths: ['studio/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'Dockerfile', '.dockerignore', '.github/workflows/studio-container.yml', 'deploy/**']
  pull_request:
    paths: ['studio/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'Dockerfile', 'deploy/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run -d --name studio-smoke -p 127.0.0.1:8090:8080 -e NODE_ENV=development -e WORKSPACE_PASSWORD=workflow-test-password ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/create-test-video.mjs && node scripts/smoke-studio.mjs
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
      - run: docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - if: always()
        run: docker logs studio-smoke; docker rm -f studio-smoke
